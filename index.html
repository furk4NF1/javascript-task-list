<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f6f2">
  <meta name="description" content="Görevlerini düzenle, tamamlananları takip et.">
  <title>Günlük Planım — Görev Takipçisi</title>
  <link rel="stylesheet" href="style.css">
  <script src="src/domain/task.js" defer></script>
  <script src="src/repository/localStorageTaskRepository.js" defer></script>
  <script src="src/service/taskService.js" defer></script>
  <script src="src/presentation/taskView.js" defer></script>
  <script src="src/presentation/taskController.js" defer></script>
  <script src="src/app.js" defer></script>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <a class="brand" href="#" aria-label="Günlük Planım ana sayfa">
        <span class="brand-mark" aria-hidden="true">✓</span>
        <span>günlük<span class="brand-light">planım</span></span>
      </a>
      <span class="date-label" id="today-label"></span>
    </header>

    <section class="intro" aria-labelledby="page-title">
      <p class="eyebrow">KÜÇÜK ADIMLAR, BÜYÜK İŞLER</p>
      <h1 id="page-title">Bugün neyi<br><span>tamamlayacaksın?</span></h1>
      <p class="intro-copy">Aklındakileri listele, odağını koru ve ilerlemeni gör.</p>
    </section>

    <section class="task-card" aria-label="Görev listesi">
      <form class="task-form" id="task-form">
        <label class="visually-hidden" for="task-input">Yeni görev</label>
        <input id="task-input" name="task" type="text" maxlength="120" placeholder="Yeni bir görev yaz..." autocomplete="off" required>
        <button class="add-button" type="submit"><span aria-hidden="true">+</span> Ekle</button>
      </form>
      <p class="form-message" id="app-message" role="status" aria-live="polite" hidden></p>

      <div class="list-toolbar">
        <div class="filters" role="group" aria-label="Görevleri filtrele">
          <button class="filter-button is-active" type="button" data-filter="all" aria-pressed="true">Tümü</button>
          <button class="filter-button" type="button" data-filter="open" aria-pressed="false">Devam eden</button>
          <button class="filter-button" type="button" data-filter="done" aria-pressed="false">Tamamlanan</button>
        </div>
        <span class="task-count" id="task-count" aria-live="polite"></span>
      </div>

      <ul class="task-list" id="task-list" aria-label="Görevler"></ul>
      <div class="empty-state" id="empty-state">
        <span class="empty-icon" aria-hidden="true">✦</span>
        <p class="empty-title">Liste tertemiz</p>
        <p class="empty-copy">Başlamak için yukarıya ilk görevini ekle.</p>
      </div>

      <footer class="card-footer">
        <span id="progress-label">Başlamak için bir görev ekle</span>
        <button class="clear-button" id="clear-completed" type="button" hidden>Tamamlananları sil</button>
      </footer>
    </section>

    <p class="privacy-note"><span aria-hidden="true">●</span> Görevlerin bu tarayıcıda saklanır.</p>
  </main>
</body>
</html>
